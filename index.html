<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MALIK CALCULATOR </title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash"><h1>MALIK CALC.</h1><div class="bar"></div></div>
<div class="wrap">
  <h1>MALIK CALC.</h1>
  <div class="sub">Smart calculator</div>
  <div class="layout">
    <div class="calc">
      <div class="screen"><div id="expr">Ready to calculate</div><div id="result">0</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="history">
      <div class="hh"><span>History</span><button id="clr">Clear</button></div>
      <div id="hist"><div class="empty">No calculations yet!!!</div></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
